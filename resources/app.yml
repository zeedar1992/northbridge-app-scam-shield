# Databricks App: surfaces the journey to the business (Head of Fraud, fraud analysts, payments product).
# Resources give the app's service principal least-privilege access to exactly what it needs.
resources:
  apps:
    scam_shield_app:
      name: ${var.app_name}
      description: "Northbridge Bank APP Scam Shield - outcome dashboard, Lakebase analyst queue with GenAI case notes, real-time payment check, Ask Genie."
      source_code_path: ../src/app
      resources:
        - name: sql-warehouse
          description: KPIs from Unity Catalog gold / ML tables
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          description: Lakebase operational store (synced alert queue + app-owned case tables)
          postgres:
            branch: projects/${var.lakebase_project}/branches/production
            database: projects/${var.lakebase_project}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: llm-endpoint
          description: GenAI customer warnings and follow-up drafts
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        - name: serving-endpoint
          description: Real-time APP-scam risk scoring (UC model @champion)
          serving_endpoint:
            name: ${var.serving_endpoint}
            permission: CAN_QUERY
        - name: genie-space
          description: Ask Genie tab (Conversation API)
          genie_space:
            name: northbridge-scam-genie
            space_id: ${resources.genie_spaces.northbridge_scam_genie.id}
            permission: CAN_RUN
      permissions:
        - level: CAN_USE
          group_name: users
